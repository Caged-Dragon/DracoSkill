services:
  - type: web
    name: dracoskill-backend
    runtime: docker            # Docker, not the Python runtime: Java/C/C++/Node toolchains need an image
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter              # persistent disks (below) need a paid plan; "free" works but forgets everything on redeploy
    healthCheckPath: /health
    disk:
      name: dracoskill-data
      mountPath: /var/data     # DB + users' installed packages live here
      sizeGB: 10
    envVars:
      - key: DRACOSKILL_BASE_URL
        sync: false
      # Optional tuning: DRACOSKILL_USER_QUOTA_MB (default 1024), DRACOSKILL_MAX_RUNS (4), SF_TIMEOUT (5)
